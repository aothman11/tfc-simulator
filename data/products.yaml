# Bill of materials: ingredient fractions per liter of finished product
# These are ASSUMPTIONS — calibrated to match R2 purchase values
# See assumptions.yaml: bom_orange_fraction, bom_mango_fraction, bom_vitc_fraction
bom:
  # fraction of each liter that is each ingredient (liters of ingredient per liter of product)
  orange_1l:
    orange: 0.285      # assumption: bom_orange_1l
    pack: 1.0          # 1 pack unit per piece (normalized)
  c_power_1l:
    orange: 0.285
    vitamin_c: 0.0006  # trace vitamin C
    pack: 1.0
  mango_1l:
    orange: 0.19       # less orange in mango blend
    mango: 0.095       # assumption: bom_mango_fraction
    pack: 1.0
  orange_pet:
    orange: 0.285
    pet: 1.0           # 1 PET bottle per piece (normalized per piece, not per liter)
  c_power_pet:
    orange: 0.285
    vitamin_c: 0.0006
    pet: 1.0
  mango_pet:
    orange: 0.19
    mango: 0.095
    pet: 1.0

# Distribution
distribution:
