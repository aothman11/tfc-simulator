# assumptions.yaml — every value NOT from the real game goes here
# Format: name, default, min, max, reason, status (UNVERIFIED | calibrated | estimated)
# UI must show "depends on unverified assumptions: ..." when output uses any UNVERIFIED entry.

assumptions:

  # ── Demand model ──────────────────────────────────────────────────────────────
  - name: demand_noise_cv
    default: 0.47
    min: 0.35
    max: 0.65
    reason: "Forecast error in R2 was 44–65% per product-week; using average 47% as CV."
    status: calibrated

  - name: demand_seed
    default: 42
    min: 0
    max: 99999
    reason: "Fixed seed for deterministic single runs. Monte Carlo samples many seeds."
    status: estimated

  # ── Promotion uplifts (Roles document, direction only; magnitudes here are assumptions) ──
  - name: promo_uplift_none
    default: 0.0
    min: 0.0
    max: 0.0
    reason: "Roles document: none = 0%."
    status: calibrated

  - name: promo_uplift_low
    default: 0.0075
    min: 0.005
    max: 0.010
    reason: "Roles document: low = +0.5–1.0%. Using midpoint."
    status: estimated

  - name: promo_uplift_middle
    default: 0.0175
    min: 0.015
    max: 0.020
    reason: "Roles document: middle = +1.5–2.0%. Using midpoint."
    status: estimated

  - name: promo_uplift_high
    default: 0.048
    min: 0.040
    max: 0.055
    reason: "Roles document: high = +4.0–5.5%. Using midpoint."
    status: estimated

  - name: promo_vfm_multiplier
    default: 2.0
    min: 1.5
    max: 2.0
    reason: "Roles document: uplift doubled for value-for-money customers."
    status: estimated

  - name: promo_horizon_short_multiplier
    default: 1.0
    min: 1.0
    max: 1.0
    reason: "Short horizon is the baseline; uplift not multiplied further."
    status: calibrated

  - name: promo_horizon_long_multiplier
    default: 1.15
    min: 1.0
    max: 1.3
    reason: "Long horizon: more time for promotional buildup, estimated +15%."
    status: UNVERIFIED

  # ── Contract index effects (magnitudes are assumptions; directions from Roles doc) ──
  - name: idx_service_above_promise_per_pp
    default: 0.0002
    min: 0.0001
    max: 0.0005
    reason: "Each extra percentage point above service promise raises index. Estimated."
    status: UNVERIFIED

  - name: idx_service_below_promise_penalty_per_pp
    default: 0.0010
    min: 0.0005
    max: 0.002
    reason: "Each pp below promise triggers penalty, larger than the bonus. Estimated."
    status: UNVERIFIED

  - name: idx_payment_term_per_week
    default: -0.0015
    min: -0.003
    max: -0.0005
    reason: "Longer customer payment term lowers index (customer gets cash-flow benefit). Estimated."
    status: UNVERIFIED

  - name: idx_trade_unit_box_vs_layer
    default: 0.003
    min: 0.001
    max: 0.006
    reason: "Box < pallet_layer raises index (smaller unit is more convenient for customer). Estimated."
    status: UNVERIFIED

  - name: idx_trade_unit_layer_vs_pallet
    default: 0.002
    min: 0.001
    max: 0.004
    reason: "Pallet_layer < pallet raises index. Estimated."
    status: UNVERIFIED

  - name: idx_promo_pressure_reduction_per_step
    default: 0.004
    min: 0.002
    max: 0.008
    reason: "Lower promotional pressure raises index (heavy→middle→none). Estimated."
    status: UNVERIFIED

  - name: idx_promo_horizon_short_vs_long
    default: 0.002
    min: 0.001
    max: 0.004
    reason: "Shorter horizon raises index (less risk for customer). Estimated."
    status: UNVERIFIED

  - name: idx_shelf_life_per_pct_point
    default: 0.0003
    min: 0.0001
    max: 0.0006
    reason: "Higher requested shelf life % raises index slightly. Estimated. Range 40–85% allowed."
    status: UNVERIFIED

  - name: idx_customer_vmi_delta_fg
    default: -0.0086
    min: -0.015
    max: -0.003
    reason: "Real test: F&G VMI changed index 0.9959→0.9873 = −0.0086. Used as calibrated default."
    status: calibrated

  - name: idx_customer_vmi_delta_land
    default: -0.0037
    min: -0.008
    max: -0.001
    reason: "Real test: LAND VMI changed index 0.9623→0.9586 = −0.0037. Calibrated."
    status: calibrated

  - name: idx_customer_vmi_delta_dominicks
    default: -0.0192
    min: -0.025
    max: -0.010
    reason: "Real test: DOM VMI changed index 1.0545→1.0353 = −0.0192. Calibrated."
    status: calibrated

  - name: idx_deadline_per_hour_earlier
    default: -0.0005
    min: -0.002
    max: 0.0
    reason: "Earlier order deadline lowers index (less flexibility for customer). Estimated."
    status: UNVERIFIED

  # ── Service bonus/penalty formula ──────────────────────────────────────────────
  - name: service_bonus_fraction_of_revenue
    default: 0.00446
    min: 0.002
    max: 0.008
    reason: "Calibrated: R2 total bonus €12,095 / contracted €2,711,810 = 0.446%. Applied as flat fraction of contracted revenue per customer."
    status: calibrated

  - name: service_penalty_multiplier_vs_bonus
    default: 3.0
    min: 2.0
    max: 5.0
    reason: "Penalty for missing promise is larger than bonus for exceeding it. Estimated."
    status: UNVERIFIED

  # ── Production Interval Tool ──────────────────────────────────────────────────
  - name: smed_changeover_reduction
    default: 0.30
    min: 0.20
    max: 0.40
    reason: "Roles document (PDF): SMED reduces changeover times by 30%. Confirmed from official source."
    status: calibrated

  - name: increase_speed_factor
    default: 1.05
    min: 1.02
    max: 1.10
    reason: "Increase speed project raises line speed ~5%. Estimated."
    status: UNVERIFIED

  - name: breakdown_hours_per_week
    default: 5.1
    min: 2.0
    max: 10.0
    reason: "Real load = tool value + ~11h/week. Tool adds ~5.9h startup. So breakdown ≈ 11 − 5.9 = 5.1h. Estimated."
    status: UNVERIFIED

  - name: pit_extra_hours_per_week
    default: 11.0
    min: 8.0
    max: 15.0
    reason: "Real load ≈ tool value + ~11 hours per week (per game notes)."
    status: calibrated

  # ── Warehouse picking ──────────────────────────────────────────────────────────
  - name: picking_time_per_item_min
    default: 0.5
    min: 0.0
    max: 2.0
    reason: "Outbound picking time per individual item — rule cut off in source notes. UNVERIFIED."
    status: UNVERIFIED

  # ── Bill of materials (ingredient fractions) ──────────────────────────────────
  - name: bom_orange_fraction_1l
    default: 0.285
    min: 0.20
    max: 0.40
    reason: "Calibrated: orange purchase €433,498 / (total orange-product volume × price). Approximate."
    status: calibrated

  - name: bom_mango_fraction_mango_products
    default: 0.095
    min: 0.05
    max: 0.15
    reason: "Calibrated: mango purchase €87,399 / (mango-product volume × price). Approximate."
    status: calibrated

  - name: bom_vitc_fraction_cpower_products
    default: 0.0006
    min: 0.0001
    max: 0.002
    reason: "Calibrated: vitamin C purchase €2,493 / (C-power product volume × price). Approximate."
    status: calibrated

  # ── Supplier price index effects ──────────────────────────────────────────────
  - name: supplier_idx_payment_term_per_week
    default: 0.002
    min: 0.001
    max: 0.004
    reason: "Longer supplier payment term (more weeks to pay) raises supplier price index. Estimated."
    status: UNVERIFIED

  - name: supplier_idx_vmi_base_delta
    default: -0.012
    min: -0.03
    max: -0.003
    reason: "Supplier VMI reduces supplier price. Default calibrated to orange VMI −0.0157 test."
    status: calibrated

  # ── Inflate PET ──────────────────────────────────────────────────────────────
  - name: inflate_depreciation_per_round
    default: 0.0
    min: 0.0
    max: 140000
    reason: "Unknown whether €700K Inflate PET investment is depreciated in addition to running cost."
    status: UNVERIFIED

  - name: inflate_pet_storage_fraction
    default: 0.10
    min: 0.05
    max: 0.20
    reason: "Preforms take ~10x less warehouse space than bottles. Fraction of original PET pallet footprint."
    status: UNVERIFIED

  - name: inflate_pet_transport_saving_pct
    default: 0.50
    min: 0.0
    max: 0.90
    reason: "Preforms are smaller/lighter; transport cost of PET probably falls. Magnitude unknown."
    status: UNVERIFIED

  - name: inflate_pet_speed_penalty_pct
    default: 0.0
    min: 0.0
    max: 0.10
    reason: "Inflation process may slow bottling line. Not mentioned in source; assuming no slowdown."
    status: UNVERIFIED

  # ── Obsoletes scrap + risk ────────────────────────────────────────────────────
  - name: obsoletes_risk_equals_scrap
    default: true
    min: null
    max: null
    reason: "R2 P&L: scrap €52,800 = risk €52,800. Risk factor = 1.0× scrap. Calibrated."
    status: calibrated

  - name: obsoletes_scrap_cost_fraction
    default: 1.0
    min: 0.8
    max: 1.2
    reason: "Scrap is at purchase/production cost. Assumed = full cost. Estimated."
    status: UNVERIFIED

  # ── Supplier price basic values ───────────────────────────────────────────────
  - name: price_orange_per_liter
    default: 0.40
    min: 0.30
    max: 0.55
    reason: "Roles document: 0.40/liter. Marked UNVERIFIED per section 3.5."
    status: UNVERIFIED

  - name: price_mango_per_liter
    default: 0.90
    min: 0.70
    max: 1.20
    reason: "Roles document: 0.90/liter. Marked UNVERIFIED per section 3.5."
    status: UNVERIFIED

  - name: price_vitamin_c_per_liter
    default: 0.15
    min: 0.10
    max: 0.25
    reason: "Roles document: 0.15/liter. Marked UNVERIFIED per section 3.5."
    status: UNVERIFIED

  - name: price_pack_per_unit
    default: 0.037
    min: 0.025
    max: 0.050
    reason: "Calibrated: R2 pack purchase €120,792 / 3,276,000 units = €0.0369. Rounded to 0.037."
    status: calibrated

  - name: price_pet_per_bottle
    default: 0.0074
    min: 0.005
    max: 0.015
    reason: "Derived: PET purchase €268,342 / (total PET bottles per round). Calibrated."
    status: calibrated

  # ── Overhead ─────────────────────────────────────────────────────────────────
  - name: overhead_other_per_round
    default: 149000
    min: 120000
    max: 180000
    reason: "R2 P&L 'other overhead' ≈ €149K. Unknown composition. Treated as fixed."
    status: UNVERIFIED

  # ── Customer Dominick's value_for_money ──────────────────────────────────────
  - name: dominicks_value_for_money
    default: false
    min: null
    max: null
    reason: "Export scrambled; cannot confirm. Assumed false (no multiplier on promotion uplift)."
    status: UNVERIFIED

  # ── MCC outsourcing price benefit ────────────────────────────────────────────
  - name: mcc_price_benefit
    default: 0.003
    min: 0.0
    max: 0.005
    reason: "MCC: up to +0.5% price benefit. Default midpoint 0.3%. Estimated."
    status: UNVERIFIED

  # ── Investment composition ───────────────────────────────────────────────────
  - name: working_capital_inventory_weeks
    default: 4.0
    min: 2.0
    max: 8.0
    reason: "Working capital tied up in inventory (raw material + WIP + FG). Estimated."
    status: UNVERIFIED

  - name: roi_hurdle_rate
    default: 0.061
    min: 0.04
    max: 0.10
    reason: "Used in Inflate PET gate: net gain ≥ 6.1% × €700K = €42.7K per round. From prompt."
    status: calibrated

  # ── Energy and water overhead (R2 actuals from finance report) ────────────
  - name: energy_overhead_r2
    default: 159781
    min: 120000
    max: 200000
    reason: "R2 finance report energy cost €159,781. Scales with volume_index."
    status: calibrated

  - name: water_overhead_r2
    default: 26792
    min: 20000
    max: 35000
    reason: "R2 finance report water cost €26,792. Scales with volume_index."
    status: calibrated

  # ── Tank yard for orange (PulpStore, R2 actual) ───────────────────────────
  - name: tank_yard_cost_r2
    default: 24049
    min: 15000
    max: 35000
    reason: "R2 finance report orange tank yard outsourcing €24,049. Scales with orange volume."
    status: calibrated

  # ── Stock interest (interest on inventory value, R2 actual) ──────────────
  - name: stock_interest_r2
    default: 20472
    min: 10000
    max: 35000
    reason: "R2 finance report stock interest (components €9,602 + products €10,871) = €20,472. Scales with volume_index."
    status: calibrated

  # ── Warehouse misc costs (R2 actuals from finance report) ────────────────
  - name: inbound_flex_manpower_r2
    default: 11326
    min: 5000
    max: 25000
    reason: "R2 finance report: inbound flexible manpower €11,326. Scales with volume_index."
    status: calibrated

  - name: rm_inspection_cost_r2
    default: 3044
    min: 0
    max: 10000
    reason: "R2 finance report: RM inspection cost €3,044. Scales with volume_index."
    status: calibrated

  - name: outbound_flex_manpower_r2
    default: 10209
    min: 5000
    max: 25000
    reason: "R2 finance report: outbound flexible manpower €10,209. Scales with volume_index."
    status: calibrated

  - name: outbound_admin_r2
    default: 8093
    min: 2000
    max: 20000
    reason: "R2 finance report: outbound admin (order lines, orders, outbound order lines, outbound orders) = €8,093. Scales with volume_index."
    status: calibrated

  # ── Overflow calibration (R2 actuals; stochastic demand variability) ─────
  - name: rm_overflow_r2
    default: 16455
    min: 0
    max: 60000
    reason: "R2 finance report: RM warehouse overflow cost €16,455. Model uses max(structural, this baseline × vi)."
    status: calibrated

  - name: fg_overflow_r2
    default: 9553
    min: 0
    max: 40000
    reason: "R2 finance report: FG warehouse overflow cost €9,553. Model uses max(structural, this baseline × vi)."
    status: calibrated

  # ── Distribution cost per pallet ─────────────────────────────────────────
  - name: distribution_cost_per_pallet
    default: 29.49
    min: 20.0
    max: 40.0
    reason: "Calibrated: backwards-derived from R2 target OP €215,399. 6,785 pallets dispatched → €29.49/pallet ≈ €200K total distribution."
    status: calibrated
